  </g>
  <text x="600" y="380" text-anchor="middle" fill="#f4d8c0" font-family="Arial,sans-serif" font-size="30">Shared with love</text>
  <text x="600" y="500" text-anchor="middle" fill="#ffd773" font-family="Arial,sans-serif" font-size="25" font-weight="bold">Tap the link to reveal your surprise</text>
