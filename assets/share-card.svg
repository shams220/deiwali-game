<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080d28"/>
      <stop offset=".55" stop-color="#291247"/>
      <stop offset="1" stop-color="#641b42"/>
    </linearGradient>
    <radialGradient id="firework">
      <stop stop-color="#fff8d8"/>
      <stop offset=".15" stop-color="#ffbd4a"/>
      <stop offset="1" stop-color="#ff5988" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <circle cx="180" cy="155" r="115" fill="url(#firework)"/>
  <circle cx="1010" cy="145" r="130" fill="url(#firework)"/>
  <circle cx="790" cy="520" r="100" fill="url(#firework)"/>
  <rect x="28" y="28" width="1144" height="574" fill="none" stroke="#f4c76d" stroke-width="3"/>
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#f4c76d" stroke-opacity=".4"/>
  <g text-anchor="middle" font-family="Georgia,serif">
    <text x="600" y="180" fill="#ffe6a1" font-size="32" font-weight="bold">HAPPY DIWALI</text>
